name: Publish Python 🐍 distribution 📦

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Check tag matches pyproject version
      if: startsWith(github.ref, 'refs/tags/')
      env:
        REF: ${{ github.ref_name }}
      run: |
        python3 - <<'PY'
        import os
        import tomllib

        tag = os.environ["REF"].removeprefix("v")
        declared = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]

        if tag != declared:
            raise SystemExit(
                f"tag {tag!r} does not match pyproject version {declared!r}"
            )
        PY
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v5
      with:
        name: python-package-distributions
        path: dist/

  classify:
    name: Classify tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}

    steps:
    - id: check
      env:
        REF: ${{ github.ref_name }}
      run: |
        case "$REF" in
          *rc*|*a[0-9]*|*b[0-9]*|*dev*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
          *)                            echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
        esac

  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    needs:
    - build
    - classify
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') ||
      (github.event_name == 'push' && needs.classify.outputs.prerelease == 'true')
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/django-melnottam

    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    needs:
    - build
    - classify
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi') ||
      (github.event_name == 'push' && needs.classify.outputs.prerelease == 'false')
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/django-melnottam

    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
