name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.14"
        enable-cache: true
    - name: Install dependencies
      run: uv sync --frozen
    - name: Ruff lint
      run: uv run ruff check .
    - name: Ruff format check
      run: uv run ruff format --check .

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: uv sync --frozen
    - name: Run unit tests
      run: uv run pytest tests/ -q -m "not e2e"

  e2e:
    name: End-to-end tests
    # Slow: spawns real worker subprocesses.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.14"
        enable-cache: true
    - name: Install dependencies
      run: uv sync --frozen
    - name: Run e2e tests
      run: uv run pytest tests/ -q -m e2e
