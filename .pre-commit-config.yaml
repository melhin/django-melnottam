repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  # Pytest: run the full suite via uv so it picks up the project venv
  # (Django, django_tasks_db, etc.). Failing tests block the commit.
  - repo: local
    hooks:
      - id: pytest
        name: pytest (uv run)
        entry: uv run pytest tests/ -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
