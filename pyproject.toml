[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-melnottam"
version = "0.1.2rc1"
description = "A Python package for managing Django application workers using InterpreterPoolExecutor"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    {name = "melhin", email = "me@nihlem.com"},
]
keywords = [
    "django",
    "workers",
    "interpreter-pool",
    "concurrent",
    "subinterpreters",
    "hypercorn",
    "asgi",
    "wsgi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "Django>=6.0,<7.0",
    "django-prodserver>=2.4.0",
    "django-tasks-db>=0.13.0",
    "hypercorn>=0.18.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
django-melnottam-cli = "django_melnottam.cli:main"

[project.urls]
Homepage = "https://github.com/melhin/django-melnottam"
Repository = "https://github.com/melhin/django-melnottam"
Documentation = "https://github.com/melhin/django-melnottam"
Issues = "https://github.com/melhin/django-melnottam/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py314"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B006",  # do not use mutable data structures for argument defaults
]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that spawn real worker subprocesses (slow, opt-in via -m e2e)",
]
# Don't let pytest import the e2e Django app modules as tests.
norecursedirs = ["tests/e2e_app", "tests/e2e_app/migrations"]
python_files = ["test_*.py"]

[tool.ruff.lint.isort]
known-first-party = ["django-melnottam"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django_tasks_db.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hypercorn.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
